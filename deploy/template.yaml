apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: kessel-ai-dev
parameters:
- name: NAMESPACE
  value: ${NAMESPACE}
- name: BOT_IMAGE
  value: https://quay.io/repository/redhat-services-prod/project-kessel-tenant/kessel-ai-dev
- name: IMAGE_TAG
  required: true
- name: BOT_LABEL
  value: hcc-ai-kessel
- name: BOT_REPLICAS
  value: "0"
- name: BOT_BOARD_NAME
  value: ""
- name: BOT_SPRINT_PREFIX
  value: ""
- name: BOT_INCLUDE_BACKLOG
  value: "false"
- name: BOT_INSTANCE_ID
  value: ""
- name: BOT_CONFIG_REPO
  value: ""
- name: BOT_NAME
  value: devbot-kessel
- name: BOT_CONFIG_PATH
  value: instance/kessel
- name: GCP_PROJECT_ID
  required: true
- name: GCP_REGION
  required: true
- name: VERTEX_ALLOWED_MODELS
  required: true
- name: SLACK_WEBHOOK_URL
  value: ""
- name: POSTGRES_PASSWORD
  description: PostgreSQL sidecar password (auto-generated if omitted)
  generate: expression
  from: "[a-zA-Z0-9]{32}"
objects:

# ============================================================================
# Bot-only deployment for kessel-ai-dev runner instance.
#
# Shared infrastructure (proxy, memory-server, secrets) is deployed by
# the platform-frontend-ai-dev template in the same namespace.
# This template creates only:
#   1. Bot Deployment (name controlled by BOT_NAME parameter)
#      - PostgreSQL sidecar for local migration smoke tests
#   2. NetworkPolicy (egress restricted to proxy + memory-server + DNS)
#   3. ScaledObject (KEDA cron scaler — 20.5h/day active, 3.5h downtime)
#
# Prerequisites (deployed by platform-frontend-ai-dev):
#   - devbot-proxy       (ports 3128, 9090, 8443, 8444, 8446)
#   - devbot-memory-server (port 8080)
#   - devbot-secrets     (Vault secret with git identity + credentials)
# ============================================================================

# --- PostgreSQL sidecar password (generated at deploy time) ---
- apiVersion: v1
  kind: Secret
  metadata:
    name: ${BOT_NAME}-pgpass
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  stringData:
    password: ${POSTGRES_PASSWORD}

# --- Bot Deployment ---
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: ${BOT_NAME}
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    replicas: ${{BOT_REPLICAS}}
    selector:
      matchLabels:
        app.kubernetes.io/name: ${BOT_NAME}
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ${BOT_NAME}
          app.kubernetes.io/component: bot
          app.kubernetes.io/part-of: devbot
      spec:
        containers:
        - name: bot
          image: ${BOT_IMAGE}:${IMAGE_TAG}
          # FIND-004: Override entrypoint to read SSO credentials from
          # file-mounted secrets instead of container env vars.
          # Writes .credentials in the same format entrypoint.sh expects,
          # then execs the original entrypoint unchanged.
          command: ["tini", "--", "bash", "-c"]
          args:
          - |
            if [ -f /run/secrets/sso/e2e-username ] && [ -f /run/secrets/sso/e2e-password ]; then
              _u=$(cat /run/secrets/sso/e2e-username)
              _p=$(cat /run/secrets/sso/e2e-password)
              printf '{"sso": {"username": "%s", "password": "%s"}}\n' "$_u" "$_p" \
                > /home/botuser/app/.credentials
              chmod 600 /home/botuser/app/.credentials
              unset _u _p
            fi
            exec bash entrypoint.sh
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
          - name: BOT_LABEL
            value: ${BOT_LABEL}
          - name: BOT_MEMORY_URL
            value: http://devbot-memory-server:8080/mcp
          - name: BOT_MEMORY_HEALTH_URL
            value: http://devbot-memory-server:8080/health
          - name: BOT_MEMORY_HEALTH_TIMEOUT
            value: "120"
          # Vertex AI — auth proxied through proxy container
          - name: CLAUDE_CODE_SKIP_VERTEX_AUTH
            value: "true"
          - name: ANTHROPIC_VERTEX_BASE_URL
            value: http://devbot-proxy:8443
          - name: ANTHROPIC_VERTEX_PROJECT_ID
            value: dummy-project
          - name: CLOUD_ML_REGION
            value: global
          # Executor — thin client connects to proxy over TCP
          - name: EXECUTOR_ADDR
            value: devbot-proxy:9090
          # Git identity — per-platform (from shared Vault secret)
          - name: GH_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gh-username
          - name: GH_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-email
          - name: GL_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-name
          - name: GL_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-email
          # Jira identity (from shared Vault secret)
          - name: BOT_JIRA_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: jira-email
          # Bot config
          - name: BOT_BOARD_NAME
            value: ${BOT_BOARD_NAME}
          - name: BOT_SPRINT_PREFIX
            value: ${BOT_SPRINT_PREFIX}
          - name: BOT_INCLUDE_BACKLOG
            value: ${BOT_INCLUDE_BACKLOG}
          - name: BOT_INSTANCE_ID
            value: ${BOT_INSTANCE_ID}
          - name: BOT_CONFIG_REPO
            value: ${BOT_CONFIG_REPO}
          - name: BOT_CONFIG_PATH
            value: ${BOT_CONFIG_PATH}
          - name: BOT_DASHBOARD_URL
            value: http://devbot-memory-server:8080/api/bot-status
          - name: COSTS_API_URL
            value: http://devbot-memory-server:8080/api/costs
          # Slack notifications
          - name: SLACK_WEBHOOK_URL
            value: ${SLACK_WEBHOOK_URL}
          # Proxy — shared pod deployed by platform-frontend-ai-dev
          - name: PROXY_HOST
            value: devbot-proxy
          - name: HTTP_PROXY
            value: http://devbot-proxy:3128
          - name: HTTPS_PROXY
            value: http://devbot-proxy:3128
          - name: http_proxy
            value: http://devbot-proxy:3128
          - name: https_proxy
            value: http://devbot-proxy:3128
          - name: NO_PROXY
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          - name: no_proxy
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          # Jira — proxied through proxy container (mcp-atlassian on port 8444)
          - name: JIRA_MCP_URL
            value: http://devbot-proxy:8444/mcp
          # GH release upload — proxied through proxy container (port 8446)
          - name: GH_RELEASE_UPLOAD_URL
            value: http://devbot-proxy:8446/upload
          # SSO credentials (FIND-004): mounted as files at /run/secrets/sso/
          # instead of env vars — see command override and sso-secrets volume.
          # PostgreSQL sidecar — env vars for setup script and migration smoke tests
          - name: POSTGRES_HOST
            value: localhost
          - name: POSTGRES_PORT
            value: "15432"
          - name: POSTGRES_DB
            value: inventory
          - name: POSTGRES_USER
            value: inventory
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ${BOT_NAME}-pgpass
                key: password
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 16Gi
          volumeMounts:
          - name: sso-secrets
            mountPath: /run/secrets/sso
            readOnly: true

        # PostgreSQL sidecar — shares pod network so bot reaches it at localhost:15432.
        # Uses the same RHEL image family as insights-rbac (OpenShift-compatible arbitrary UID).
        # Data is ephemeral (EmptyDir): starts clean on every pod restart, no PVC needed.
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:9.5-1744136555
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
          - name: POSTGRESQL_DATABASE
            value: inventory
          - name: POSTGRESQL_USER
            value: inventory
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ${BOT_NAME}-pgpass
                key: password
          - name: PGPORT
            value: "15432"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory", "-d", "inventory", "-p", "15432"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
          - name: pgdata
            mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        volumes:
        - name: sso-secrets
          secret:
            secretName: devbot-secrets
            items:
            - key: e2e-username
              path: e2e-username
            - key: e2e-password
              path: e2e-password
            defaultMode: 0400
        - name: pgdata
          emptyDir: {}

# --- NetworkPolicy: Bot can only reach proxy + memory-server + DNS ---
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: ${BOT_NAME}-egress
    labels:
      app.kubernetes.io/part-of: devbot
  spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ${BOT_NAME}
    policyTypes:
    - Egress
    egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: devbot-proxy
      ports:
      - port: 3128
        protocol: TCP
      - port: 9090
        protocol: TCP
      - port: 8443
        protocol: TCP
      - port: 8444
        protocol: TCP
      - port: 8446
        protocol: TCP
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: memory-server
      ports:
      - port: 8080
        protocol: TCP
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
      ports:
      - port: 5353
        protocol: UDP
      - port: 5353
        protocol: TCP

# --- Cron Scaler: 20.5h active, 3.5h downtime daily ---
# Covers distributed team hours: India (IST) 9:00 AM start through US West (PDT) 5:00 PM end.
# Downtime window: 00:00–03:30 UTC (5:00–8:30 PM PDT / 5:30–9:00 AM IST)
- apiVersion: keda.sh/v1alpha1
  kind: ScaledObject
  metadata:
    name: ${BOT_NAME}-cron-scaler
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/part-of: devbot
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: ${BOT_NAME}
    minReplicaCount: 0
    maxReplicaCount: 1
    triggers:
    - type: cron
      metadata:
        timezone: "UTC"
        # 03:30 UTC = 9:00 AM IST = 8:30 PM PDT (previous day) = 4:30 AM BST
        start: "30 3 * * *"
        # 00:00 UTC = 5:30 AM IST = 5:00 PM PDT = 1:00 AM BST (next day)
        end: "0 0 * * *"
        desiredReplicas: "1"
